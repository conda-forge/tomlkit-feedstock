schema_version: 1

context:
  version: "0.15.2"

package:
  name: tomlkit
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tomlkit/tomlkit-${{ version }}.tar.gz
  sha256: 83e32755ba1d20d9340bd069ee97e9f6232ba2346b63ffcba425de01f7e327a6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - poetry-core
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - tomlkit
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Style preserving TOML library
  license: MIT
  license_file:
    - LICENSE
    - tests/toml-test/LICENSE
  homepage: https://github.com/python-poetry/tomlkit

extra:
  recipe-maintainers:
    - ocefpaf
